
name: eShopOnWeb Build and Test Belastingdienst

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-az400-eshoponweb-ksalam
  LOCATION: westeurope
  TEMPLATE_FILE: .azure/bicep/webapp.bicep
  WEBAPP_NAME: az400-webapp-ksalam

jobs:
  buildandtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ./eShopOnWeb.sln

      - name: Build application
        run: |
          dotnet build ./eShopOnWeb.sln \
            --configuration Release \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test ./eShopOnWeb.sln \
            --configuration Release \
            --no-build

      - name: Publish application
        run: |
          dotnet publish ./src/Web/Web.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Install CycloneDX
        run: |
          dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          dotnet CycloneDX ./eShopOnWeb.sln \
            -o ./sbom 
            
          # ls -la ./sbom


      # Upload the generated CycloneDX SBOM to Dependency-Track
      - name: Upload SBOM to Dependency-Track
        env:
          # Dependency-Track API URL
          DTRACK_URL: ${{ vars.DTRACK_URL }}

          # API key stored securely in GitHub Secrets
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

          # UUID of the Dependency-Track project
          DTRACK_PROJECT_UUID: ${{ vars.DTRACK_PROJECT_UUID }}

        run: |
          # Verify that the SBOM file exists
          test -s ./sbom/bom.xml

          # Upload the SBOM using the Dependency-Track REST API
          curl --fail-with-body \
            --request POST \
            "${DTRACK_URL%/}/api/v1/bom" \
            --header "X-Api-Key: $DTRACK_API_KEY" \
            --form "project=$DTRACK_PROJECT_UUID" \
            --form "bom=@./sbom/bom.xml"

          
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          if-no-files-found: error

      - name: Upload Bicep template
        uses: actions/upload-artifact@v4
        with:
          name: bicep-template
          path: ${{ env.TEMPLATE_FILE }}
          if-no-files-found: error

      - name: Check generated SBOM
        run: |
          ls -lah ./sbom/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: 
            ./sbom/bom.xml
          if-no-files-found: error
