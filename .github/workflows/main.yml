
name: eShopOnWeb Build and Test Belastingdienst

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-az400-eshoponweb-ksalam
  LOCATION: westeurope
  TEMPLATE_FILE: .azure/bicep/webapp.bicep
  WEBAPP_NAME: az400-webapp-ksalam

jobs:
  buildandtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ./eShopOnWeb.sln

      - name: Build application
        run: |
          dotnet build ./eShopOnWeb.sln \
            --configuration Release \
            --no-restore

      # - name: Run unit tests
      #   run: |
      #     dotnet test ./eShopOnWeb.sln \
      #       --configuration Release \
      #       --no-build

      - name: Publish application
        run: |
          dotnet publish ./src/Web/Web.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Install CycloneDX
        run: |
          dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          dotnet CycloneDX ./eShopOnWeb.sln \
            -o ./sbom --j
            
          ls -la ./sbom
          
      - name: Add CPE to SBOM
        run: |
          python .github/scripts/add-cpe.py \
            ./sbom/bom.json \
            .github/cpe-mapping.json  
      
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          if-no-files-found: error

      - name: Upload Bicep template
        uses: actions/upload-artifact@v4
        with:
          name: bicep-template
          path: ${{ env.TEMPLATE_FILE }}
          if-no-files-found: error

      - name: Check generated SBOM
        run: |
          ls -lah ./sbom/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: 
            ./sbom/bom.json
          if-no-files-found: error
